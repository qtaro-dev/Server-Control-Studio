name: Application regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-toolchain
      - run: node tools/npm/run.cjs ci
        env:
          # Unit tests compare bundled notices with the Windows x64 distribution.
          ELECTRON_INSTALL_PLATFORM: win32
          ELECTRON_INSTALL_ARCH: x64
      - run: node tools/npm/run.cjs audit
      - run: node tools/npm/run.cjs test

  electron:
    name: Electron regression (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-toolchain
      - run: node tools/npm/run.cjs ci
      - run: node tools/npm/run.cjs run test:electron
