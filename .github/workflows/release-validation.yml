name: Local-candidate release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/project-toolchain
      - run: node tools/npm/run.cjs ci
      - run: node tools/npm/run.cjs audit --omit=dev
      - run: node tools/npm/run.cjs test
      - run: node tools/npm/run.cjs run test:electron
      - run: node tools/npm/run.cjs run prepare:notices
      - run: node scripts/sync-release-docs.cjs
      - run: node tools/npm/run.cjs run build:win
      - run: node tools/npm/run.cjs run verify:package
      - run: node tools/npm/run.cjs run verify:release
      # 公開、タグ作成、他リポジトリへの書込み、EXEのアップロードは実装しない。
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/project-toolchain
      - run: node tools/npm/run.cjs ci
      - run: docker compose version
      - run: node scripts/compose-config-check.cjs
